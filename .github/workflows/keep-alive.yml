name: Keep Supabase Active

on:
  schedule:
    # GitHub Actions cron uses UTC. 00:00 UTC = 09:00 KST.
    - cron: "0 0 * * 5,0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Select from Supabase table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_ANON_KEY}" ]]; then
            echo "SUPABASE_URL and SUPABASE_ANON_KEY secrets must be configured."
            exit 1
          fi

          response=$(curl --fail-with-body --silent --show-error \
            --request GET \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/game_results?select=id&limit=1")

          echo "Supabase database query succeeded: ${response}"
