name: Keep Supabase Active

on:
  schedule:
    # Query four times daily, away from the busy start of each hour (UTC).
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Select from Supabase table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_ANON_KEY}" ]]; then
            echo "SUPABASE_URL and SUPABASE_ANON_KEY secrets must be configured."
            exit 1
          fi

          expected_url="https://aqkkznbwilrvdqpbdrfi.supabase.co"
          if [[ "${SUPABASE_URL%/}" != "${expected_url}" ]]; then
            echo "SUPABASE_URL must point to Triangle Territory (aqkkznbwilrvdqpbdrfi)."
            exit 1
          fi
          echo "Verified target project: aqkkznbwilrvdqpbdrfi"

          endpoint="${SUPABASE_URL%/}/rest/v1/game_results?select=id&limit=1"
          response_file=$(mktemp)
          trap 'rm -f "${response_file}"' EXIT

          echo "Querying table endpoint: /rest/v1/game_results?select=id&limit=1"

          if ! http_status=$(curl --silent --show-error \
            --connect-timeout 15 \
            --max-time 60 \
            --retry 3 \
            --retry-delay 5 \
            --retry-max-time 180 \
            --output "${response_file}" \
            --write-out "%{http_code}" \
            --request GET \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${endpoint}"); then
            echo "HTTP status: ${http_status:-000}"
            echo "Response body: $(cat "${response_file}")"
            echo "Supabase database request failed before receiving a valid response."
            exit 1
          fi

          echo "HTTP status: ${http_status}"
          echo "Response body: $(cat "${response_file}")"

          if [[ ! "${http_status}" =~ ^2[0-9]{2}$ ]]; then
            echo "Supabase database query failed with HTTP ${http_status}."
            exit 1
          fi

          echo "Supabase database query succeeded."
